[package]
name = "hnl-ext-compile"
version = "0.1.0"
edition = "2024"
description = "`hnl compile` — compilation targets as a dynamic `hnl` extension (ADR-0149)."
license = "MIT"
repository = "https://github.com/handl-lang/ext-compile"
homepage = "https://handl-lang.github.io/docs/ext-compile/"
documentation = "https://handl-lang.github.io/docs/ext-compile/reference/"
readme = "README.md"
keywords = ["handl", "extension", "cli"]
categories = ["development-tools"]
# Git-install only: https://github.com/handl-lang/ext-compile (no crates.io).
publish = false

[lib]
# `cdylib` is the shipped artifact (`libhnl_ext_compile.{so,dylib,dll}`);
# `rlib` keeps `cargo test` statically linked (ADR-0149 §Consequences).
crate-type = ["cdylib", "rlib"]

[dependencies]
handl-ext = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-kit-data-prelude = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-kit-arrow-lower = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-compile = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-tool-lex-pattern = { git = "https://github.com/handl-lang/tool-lex-pattern", branch = "main" }
hnl-tool-parse = { git = "https://github.com/handl-lang/tool-parse", branch = "main" }
hnl-tool-parse-pratt = { git = "https://github.com/handl-lang/tool-parse-pratt", branch = "main" }
hnl-tool-typecheck = { git = "https://github.com/handl-lang/tool-typecheck", branch = "main" }
# PL-004 T-101: the desired-state kernel the `compile` command routes
# through — `Emitter<Term>`/`Emitter<JsIr>` impls in the `tool-compile-*`
# crates produce `Change` sets applied via `Engine` + `MemoryStore`.
# `handl-term` provides `IrModule for Term`.
hnl-tool-codegen = { git = "https://github.com/handl-lang/tool-codegen", branch = "main", features = ["handl-term"] }
handl-plugin-ext-compile = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-runtime = { git = "https://github.com/handl-lang/host", branch = "main" }
# The six compile targets — each lives in its target repo (ADR-0128 §0.3:
# the extension's target set is its dep list). Defaults match the old
# `hnl` binary's feature set: all six on.
handl-plugin-compile-js = { git = "https://github.com/handl-lang/tool-compile-js", branch = "main" }
handl-plugin-compile-llvm = { git = "https://github.com/handl-lang/tool-compile-llvm", branch = "main" }
handl-plugin-compile-handl = { git = "https://github.com/handl-lang/tool-compile-handl", branch = "main" }
handl-plugin-compile-term = { git = "https://github.com/handl-lang/tool-compile-term", branch = "main" }
handl-plugin-compile-dot = { git = "https://github.com/handl-lang/tool-compile-dot", branch = "main" }
handl-plugin-compile-sexp = { git = "https://github.com/handl-lang/tool-compile-sexp", branch = "main" }
serde_json = "1"

[profile.dev]
opt-level = 1

# ADR-0128 §Resolution: local development resolves deps from the sibling
# checkouts; the committed `[patch]` tables are stripped by CI, which
# resolves the `branch = "main"` git sources instead.
#
# T-124–T-126: the folded kit crates (`handl-kit-data-prelude` included —
# it moved into the host workspace) resolve from the sibling `../host`
# checkout — several vendor `../../../lib-*` packages in build.rs, which
# a bare git checkout cannot see.
[patch."https://github.com/handl-lang/host"]
handl-kit-core = { path = "../host/crates/handl-kit-core" }
handl-kit-prelude = { path = "../host/crates/kit-prelude" }
handl-kit-data-prelude = { path = "../host/crates/handl-kit-data-prelude" }
handl-kit-prelude-lang = { path = "../host/crates/handl-kit-prelude-lang" }
handl-kit-stdlib = { path = "../host/crates/handl-kit-stdlib" }
handl-kit-server = { path = "../host/crates/handl-kit-server" }
handl-kit-ffi = { path = "../host/crates/handl-kit-ffi" }
handl-plugin-ffi = { path = "../host/crates/plugin-ffi" }
handl-kit-lang = { path = "../host/crates/handl-kit-lang" }
handl-kit-eqsat = { path = "../host/crates/handl-kit-eqsat" }
handl-kit-mlopt = { path = "../host/crates/kit-mlopt" }
hnl-ext-mlopt = { path = "../host/crates/hnl-ext-mlopt" }
handl-kit-arrow-lower = { path = "../host/crates/handl-kit-arrow-lower" }
handl-kit-data = { path = "../host/crates/handl-kit-data" }
handl-platform = { path = "../host/crates/platform" }
handl-plugin-compile = { path = "../host/crates/plugin-compile" }
handl-plugin-ext-compile = { path = "../host/crates/plugin-ext-compile" }
handl-plugin-ext-diag = { path = "../host/crates/plugin-ext-diag" }
handl-plugin-lib-handl = { path = "../host/crates/plugin-lib-handl" }
handl-plugin-lib-stdlib = { path = "../host/crates/plugin-lib-stdlib" }
handl-plugin-lib-tag = { path = "../host/crates/plugin-lib-tag" }
handl-plugin-module = { path = "../host/crates/plugin-module" }
handl-runtime = { path = "../host/crates/handl-runtime" }

# PL-004: the desired-state codegen kernel the `compile` command routes
# through — resolve the sibling checkout like the other ext repos.
[patch."https://github.com/handl-lang/tool-codegen"]
hnl-tool-codegen = { path = "../tool-codegen" }

# The six compile targets live in the `tool-compile-*` repos; the git
# deps still carry the pre-rename `compile-*` URLs.
[patch."https://github.com/handl-lang/tool-compile-js"]
handl-plugin-compile-js = { path = "../tool-compile-js" }
[patch."https://github.com/handl-lang/tool-compile-llvm"]
handl-plugin-compile-llvm = { path = "../tool-compile-llvm" }
[patch."https://github.com/handl-lang/tool-compile-handl"]
handl-plugin-compile-handl = { path = "../tool-compile-handl/modules/compile-handl" }
[patch."https://github.com/handl-lang/tool-compile-term"]
handl-plugin-compile-term = { path = "../tool-compile-term/modules/compile-term" }
[patch."https://github.com/handl-lang/tool-compile-dot"]
handl-plugin-compile-dot = { path = "../tool-compile-dot/modules/compile-dot" }
[patch."https://github.com/handl-lang/tool-compile-sexp"]
handl-plugin-compile-sexp = { path = "../tool-compile-sexp/modules/compile-sexp" }
